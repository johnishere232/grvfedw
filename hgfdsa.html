<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>


    <style>
    body {
    background-color: darkgreen;
    font-family:Arial, sans-serif;
    }
  

    .fact-file {
    background-color: lightyellow;
    color:darkslategray;
    width: 260px;

    border: 4px solid rgb(223, 12, 12);
    margin: 30px;
    }

    animal-name{
    color: forestgreen;
    font-size: 22px;
    }
   
    detail {
    color: darkslategrey;
    }
    
    cool-fact{
    color: darkorange;
    font-style: italic;
    }
    </style>
</head>
<body>
    <div class="fact-file">
    <h2 class="animal-name">snow leopard</h2>
    <p class="detail"> type: big cat</p>
    <p class="detail"> lives in: mountain ranges of central Asia</p>
    <p class="detail"> diet: deer goats wilp sheep</p>
    <p class="cool-fact">cool fact: can leap up to 15 metres in one jump! </p>
     </div>

</body>
</html>
